name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-java: [25, 27]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up test JDK
        if: matrix.test-java != 25
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.test-java }}'
          distribution: 'temurin'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Test ASTs
        run: ./gradlew generateTestAsts

      - name: Build with Gradle
        run: ./gradlew build -PtestJavaVersion=${{ matrix.test-java }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-java }}
          path: build/reports/tests/
